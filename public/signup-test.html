<!DOCTYPE html>
<html>
<head>
    <title>Signup Test</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        #response { margin-top: 20px; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Test Signup</h1>
    <input type="email" id="email" placeholder="Email" value="test@example.com">
    <input type="password" id="password" placeholder="Password" value="TestPass123!">
    <input type="text" id="fullName" placeholder="Full Name" value="Test User">
    <input type="text" id="college" placeholder="College" value="Engineering">
    <select id="role" style="width: 100%; padding: 10px; margin: 10px 0;">
        <option value="respondent">Respondent</option>
        <option value="researcher">Researcher</option>
    </select>
    <button onclick="signup()">Sign Up</button>
    <div id="response"></div>

    <script>
        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            const college = document.getElementById('college').value;
            const role = document.getElementById('role').value;

            const body = {
                email,
                password,
                fullName,
                college,
                role
            };

            console.log('Sending:', body);

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                console.log('Response:', data);

                const responseDiv = document.getElementById('response');
                responseDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                responseDiv.style.background = response.ok ? '#d4edda' : '#f8d7da';
                responseDiv.style.color = response.ok ? '#155724' : '#721c24';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('response').innerHTML = 'Error: ' + error.message;
                document.getElementById('response').style.background = '#f8d7da';
            }
        }
    </script>
</body>
</html>
